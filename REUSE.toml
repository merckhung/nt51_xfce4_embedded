version = 1

# Project-authored code and metadata. Specific upstream annotations below
# override this fallback; upstream components are not relicensed.
[[annotations]]
path = ["**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Merck Hung"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = ["**/busybox/.config", "**/busybox-config/**"]
precedence = "override"
SPDX-FileCopyrightText = "BusyBox contributors"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = ["chromium_rootfs/pkg/opt/chromium/**", "chromium_rootfs/pkg/usr/share/licenses/chromium/NOTICE"]
precedence = "override"
SPDX-FileCopyrightText = "The Chromium Authors and upstream contributors; see LICENSES/LicenseRef-Chromium-Bundle.txt"
SPDX-License-Identifier = "LicenseRef-Chromium-Bundle"

[[annotations]]
path = ["licenses/musl-COPYRIGHT", "**/overlay/usr/share/licenses/musl/COPYRIGHT"]
precedence = "override"
SPDX-FileCopyrightText = "2005-2020 Rich Felker and musl contributors"
SPDX-License-Identifier = "LicenseRef-musl-notices"

[[annotations]]
path = ["**/overlay/usr/share/licenses/GPL-2.0-only.txt"]
precedence = "override"
SPDX-FileCopyrightText = "1989, 1991 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-2.0-only"
