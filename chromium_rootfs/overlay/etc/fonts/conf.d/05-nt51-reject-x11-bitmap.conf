<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SPDX-License-Identifier: GPL-2.0-only -->
<!-- The X11 core bitmap fonts (misc/, 75dpi/, 100dpi/, cyrillic/) are only
     needed by Xvfb's own font path. Keeping them out of fontconfig avoids
     decompressing ~340 .pcf.gz files in every GTK process and in Chromium. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/misc/*</glob>
      <glob>/usr/share/fonts/75dpi/*</glob>
      <glob>/usr/share/fonts/100dpi/*</glob>
      <glob>/usr/share/fonts/cyrillic/*</glob>
      <glob>/usr/share/fonts/encodings/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
